<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TorrentPilot - 远程下载控制台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F7FAFF;
      color: #0F172A;
      min-height: 100vh;
    }
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px 60px;
      text-align: center;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 18px;
      color: #64748B;
      max-width: 480px;
      line-height: 1.6;
    }
    .features {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 24px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 24px;
      border: 1px solid #E2ECF8;
    }
    .card h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }
    .card p {
      font-size: 14px;
      color: #64748B;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      background: #EEF5FF;
      color: #2563EB;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    footer {
      text-align: center;
      padding: 40px 24px;
      color: #94A3B8;
      font-size: 13px;
      border-top: 1px solid #E2ECF8;
    }
    footer a { color: #2563EB; text-decoration: none; }
  </style>
</head>
<body>
  <div class="hero">
    <img class="logo" src="entry/src/main/resources/base/media/foreground.png" alt="TorrentPilot">
    <span class="badge">HarmonyOS</span>
    <h1>TorrentPilot</h1>
    <p class="subtitle">轻量级 qBittorrent 远程管理工具，随时掌控下载任务。</p>
  </div>

  <div class="features">
    <div class="card">
      <h3>实时仪表盘</h3>
      <p>下载速度、上传速度、DHT 节点一目了然，数据实时同步。</p>
    </div>
    <div class="card">
      <h3>任务管理</h3>
      <p>查看、筛选、排序种子任务，支持批量暂停、恢复和删除。</p>
    </div>
    <div class="card">
      <h3>添加下载</h3>
      <p>通过磁力链接或种子 URL 远程添加任务，支持分类和标签。</p>
    </div>
    <div class="card">
      <h3>连接详情</h3>
      <p>查看 Peer 列表、Tracker 状态、文件信息，掌握完整下载详情。</p>
    </div>
  </div>

  <footer>
    <p>TorrentPilot v1.0.0 &copy; 2025</p>
    <p style="margin-top:8px;">应用为工具类客户端，用户自行配置 qBittorrent 服务器地址，应用直连用户自有服务器。</p>
  </footer>
</body>
</html>
